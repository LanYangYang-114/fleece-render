name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust with rustfmt
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt
      - run: cargo +1.90.0 fmt --all -- --check
