name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9A-Za-z]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.ref_type == 'tag' && !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate tag and Cargo versions
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z-]*(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo 'Expected a version tag such as v0.1.0 or v0.1.0-rc.1.' >&2
            exit 1
          fi
          if [[ "$tag" != *-* ]]; then
            cargo metadata --no-deps --locked --format-version 1 | jq -e --arg version "${tag#v}" '
              [.packages[] | select(.name == "fleece-render-core" or .name == "fleece-render-server")]
              | length == 2 and all(.[]; .version == $version)
            ' > /dev/null || {
              echo "Both Cargo package versions must match release tag $tag." >&2
              exit 1
            }
          fi

  build:
    needs: validate
    uses: ./.github/workflows/build-binaries.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download binary archives from this run
        uses: actions/download-artifact@v8
        with:
          pattern: fleece-render-*
          path: release-assets
          merge-multiple: true
          skip-decompress: true

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          assets=(
            release-assets/fleece-render-linux-x86_64.tar.gz
            release-assets/fleece-render-linux-aarch64.tar.gz
            release-assets/fleece-render-windows-x86_64.zip
          )
          for asset in "${assets[@]}"; do
            if [[ ! -f "$asset" || ! -s "$asset" ]]; then
              echo "Missing or empty build artifact: $asset" >&2
              exit 1
            fi
          done

          flags=(--repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes)
          if [[ "$tag" == *-* ]]; then
            flags+=(--prerelease)
          fi
          # Include the matching changelog section before GitHub's generated notes.
          notes=$(awk -v heading="## ${tag#v}" '
            { sub(/\r$/, "") }
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)
          if [[ "$notes" =~ [^[:space:]] ]]; then
            flags+=(--notes "$notes")
          fi
          gh release create "$tag" "${assets[@]}" "${flags[@]}"

  crates-io:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Publish Core and Server to crates.io
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo 'Set CARGO_REGISTRY_TOKEN in the crates-io GitHub environment.' >&2
            exit 1
          fi
          cargo +1.90.0 publish --locked --registry crates-io \
            -p fleece-render-core -p fleece-render-server

  docker:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download Linux binary archives from this run
        uses: actions/download-artifact@v8
        with:
          pattern: fleece-render-linux-*.tar.gz
          path: release-assets
          merge-multiple: true
          skip-decompress: true
      - name: Extract Linux executables
        shell: bash
        run: |
          mkdir -p release-binaries/{amd64,arm64}
          tar -xzf release-assets/fleece-render-linux-x86_64.tar.gz -C release-binaries/amd64 ./fleece-render
          tar -xzf release-assets/fleece-render-linux-aarch64.tar.gz -C release-binaries/arm64 ./fleece-render
          test -s release-binaries/amd64/fleece-render
          test -s release-binaries/arm64/fleece-render
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Push multi-platform Docker image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=(--tag "$image:$GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then
            tags+=(--tag "$image:latest")
          fi
          docker buildx build --push --target release \
            --platform linux/amd64,linux/arm64 \
            --build-context release-binaries=./release-binaries \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$GITHUB_REF_NAME" \
            "${tags[@]}" .
