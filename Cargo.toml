[workspace]
resolver = "2"
members = ["crates/fleece-render-core", "crates/fleece-render-server"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"
repository = "https://github.com/LanYangYang-114/fleece-render"
homepage = "https://github.com/LanYangYang-114/fleece-render"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
