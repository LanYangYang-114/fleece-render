[package]
name = "fleece-render-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "HTTP service for rendering Minecraft skins, avatars, and player profiles"
keywords = ["minecraft", "skin", "avatar", "http"]
categories = ["web-programming::http-server", "command-line-utilities"]
include = ["/src/**", "/tests/**", "/README.md", "/LICENSE"]

[[bin]]
name = "fleece-render"
path = "src/main.rs"

[features]
gpu = ["fleece-render-core/gpu"]

[dependencies]
anyhow.workspace = true
axum = "0.8"
base64.workspace = true
clap = { version = "4.5", features = ["derive", "env"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fleece-render-core = { version = "0.2.0", path = "../fleece-render-core" }
percent-encoding = "2.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli"] }
serde.workspace = true
serde_json.workspace = true
subtle = { version = "2.6", default-features = false }
tokio = { version = "1.44", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["cors", "limit", "trace"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"

[dev-dependencies]
http-body-util = "0.1"
image.workspace = true
tempfile = "3.14"
tower = { version = "0.5", features = ["util"] }
