services:
  fleece-render:
    build:
      context: .
      dockerfile: Dockerfile
    image: fleece-render:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:57680:57680"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:57680/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
